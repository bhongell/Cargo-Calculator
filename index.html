<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cargo and Draft Calculator</title>
        <link rel="stylesheet" href="CSS/globalStyle.css">
        <link rel="stylesheet" href="CSS/draftStyle.css">
        <link rel="stylesheet" href="CSS/tonnageStyle.css">
        <link rel="stylesheet" href="inputKeyboard.css">
        
<!-- jQuery -->
    <script src="js/jquery-3.7.1.min.js"></script>

<!--calculation scripts -->
    <script src="js/dwaCalc.js"></script>
    <script src="js/meanDraftCalc.js"></script>
    <script src="js/swdCalc.js"></script>
    <script src="js/currentTonnageCalc.js"></script>

    <script>
        if (window.innerWidth < 450) { // you can adjust threshold
    var s = document.createElement("script");
    s.src = "inputKeyboardChatGPTCode.js";
    document.head.appendChild(s);
}
        $(function() {
            // Load the dynamic draft content
            $("#draft").load("HTML/drafts.html", function(response, status, xhr) {
                if (status === "error") {
                    console.error("Failed to load draft content:", xhr.statusText);
                }
            });
        });
        $(function() {
            // Load the dynamic tonnage content
            $("#tonnage").load("HTML/tonnage.html", function(response, status, xhr) {
                if (status === "error") {
                    console.error("Failed to load draft content:", xhr.statusText);
                }
            });
        });
            // Use event delegation to attach click listener even to dynamically loaded content
             $(document).on('click', '#calculate', function() {
                // Call all three functions on single button press
                if (typeof handleCalculateDWA === "function") handleCalculateDWA();
                if (typeof calculateMeanDraft === "function") calculateMeanDraft();
                if (typeof calculateSWD === "function") calculateSWD();
                if (typeof currentTonnage === "function") currentTonnage();
                if (typeof tonsToGo === "function") tonsToGo();
                
            });           

        

        
    </script>
</head>
<body>
    <div id="page-container" class="page-container">
        <div>
            <div class="title-container">
                <h1>Cargo and Draft Calculator</h1>
            </div>
            <div class="toggles highlight">
                <span class="inline">
                    <input id="draft-count" type="checkbox">
                    <label for="draft-count">4 Drafts</label>
                </span>
                <span class="inline">
                    <input id="salinity-fwa" type="checkbox">
                    <label for="salinity-fwa">Salinity/FWA</label>
                </span>
                <span class="inline">
                    <input id="units" type="checkbox">
                    <label for="units">Meters</label>
                </span>
            </div>
            <div class="title-container">
                <h2>Draft</h2>
            </div>
            <div id="draft" class="container"></div>
            <div class="title-container">
                <h2>Tonnage</h2>
            </div>
            <div id="tonnage"></div>
        </div> 
    </div>
    <div id="customKeyboard" class="custom-keyboard hidden">
        <div class="keyboard-top-area">
            <button class="nav-button back-button key">< Back</button>
            <button id="keyboard-calculate" class="calculate-button" type="button">Calculate</button>
            <button class="nav-button next-button key">Next ></button>
        </div>
        <div class="number-grid">
            <button class="key grid-button">7</button>
            <button class="key grid-button">8</button>
            <button class="key grid-button">9</button>
            <button class="key grid-button right-column">-</button>
            <button class="key grid-button">4</button>
            <button class="key grid-button">5</button>
            <button class="key grid-button">6</button>
            <button class="key grid-button right-column">/</button>
            <button class="key grid-button">1</button>
            <button class="key grid-button">2</button>
            <button class="key grid-button">3</button>
            <button class="key grid-button decimal right-column">.</button>
            <button class="key grid-button" >C</button>
            <button class="key grid-button zero">0</button>
        </div>
    </div>
    <script>



    </script>
</body>
</html>
