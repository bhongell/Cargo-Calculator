<!DOCTYPE html>

<head>
    <link rel="stylesheet" href="CSS/globalStyle.css">
    <link rel="stylesheet" href="CSS/draftStyle.css">
</head>
<div id="draft-container" class="draft-container">


    <form class="form">
        <div id="top-input" class="top-input highlight"> <!--Top Input-->
            <div class="inline observed-salinity">
                <label>Observed Salinity:</label>
                <span><input inputmode="decimal" type="text" id="salinity" class="input-field-salinity custom-input" placeholder="1.015" min="1.000" max="1.025" step="0.001" >Relative Density</span>
            </div>
            <br>
            <div class="inline fwa">
                <label>Fresh Water Allowance:</label>
                <span class="inline-fwa">
                    <input inputmode="decimal" type="text" id="fwa-ft" class="input-field-ft custom-input" min="0" value="" placeholder="3" >
                    <p class="unit-imperial">Ft</p>
                    <p class="unit-metric">Cm</p>
                    <input inputmode="decimal" type="text" id="fwa-in" class="input-field-fwa-in unit-imperial custom-input" value="" placeholder="1.5" >
                    <p class="unit-imperial">In</p>
                </span>
            </div>
        </div><!--Top Input End-->
        <div class="middle-input highlight"><!--middle input-->
            <div class="grid">
                <div class="grid-item"></div>
                <div class="grid-item grid-title">
                    <p class="fourDrafts">PORT</p>
                </div>
                <div class="grid-item grid-title">
                    <p class="fourDrafts">STBD</p>
                </div>
                <div class="grid-item grid-title">FWD</div>
                <div class="grid-item">
                    <div class="inline">
                        <div class="inline-ftin"><input inputmode="decimal" type="text" class="ftin custom-input" id="port-fwd-ft" min="0" value="" >
                            <p class="unit-imperial">Ft</p>
                            <p class="unit-metric">M</p>
                        </div>
                        <div class="inline-ftin unit-imperial"><input inputmode="decimal" type="text" class="ftin custom-input" id="port-fwd-in" min="0" max="11"value="" >
                            <p class="unit-imperial">In</p>
                        </div>
                    </div>
                </div>
                <div class="grid-item">
                    <div class="inline fourDrafts">
                        <div class="inline-ftin"><input inputmode="decimal" type="text" class="ftin custom-input" id="stbd-fwd-ft" min="0" value="" >
                            <p class="unit-imperial">Ft</p>
                            <p class="unit-metric">M</p>
                        </div>
                        <div class="inline-ftin unit-imperial"><input inputmode="decimal" type="text" class="ftin custom-input" id="stbd-fwd-in" min="0" max="11" value="" >
                            <p class="unit-imperial">In</p></div>
                    </div>
                </div>
                <div class="grid-item">AFT</div>
                <div class="grid-item">
                    <div class="inline">
                        <div class="inline-ftin"><input inputmode="decimal" type="text" class="ftin custom-input" id="port-aft-ft" min="0" value="" >
                            <p class="unit-imperial">Ft</p>
                            <p class="unit-metric">M</p>
                        </div>
                        <div class="inline-ftin unit-imperial"><input inputmode="decimal" type="text" class="ftin custom-input" id="port-aft-in" min="0" max="11"value="" >
                            <p class="unit-imperial">In</p>
                        </div>
                    </div>
                </div>
                <div class="grid-item">
                    <div class="inline fourDrafts">
                        <div class="inline-ftin"><input inputmode="decimal" type="text" class="ftin custom-input" id="stbd-aft-ft" min="0" value="" >
                            <p class="unit-imperial">Ft</p>
                            <p class="unit-metric">M</p>
                        </div>
                        <div class="inline-ftin unit-imperial"><input inputmode="decimal" type="text" class="ftin custom-input" id="stbd-aft-in" min="0" max="11" value="" >
                            <p class="unit-imperial">In</p></div>
                    </div>
                </div>
            </div>
        </div><!--middle input end-->
        <div class="bottom-area highlight"><!--bottom area-->
            <div class="bottom-calcs"><!--bottom calcs-->
                <div class="inline">
                    <div class="title">
                        <p>Mean Draft:</p>
                    </div>
                    <div class="result" id="mean-draft"></div>
                </div>
                <div class="inline">
                    <div class="title">
                        <p>Trim:</p>
                    </div>
                    <div class="result" id="trim"></div>
                </div>
                <div class="inline">
                    <div class="title">
                        <p>DWA:</p>
                    </div>
                    <div class="result" id="dwa"></div>
                </div>
                <div class="inline">
                    <div class="title">
                        <p>SWD:</p>
                    </div>
                    <div class="result" id="swd"></div>
                </div>
            </div><!--bottom calcs end-->
            <div class="button-area"><!--Button area-->
                <button id="calculate-draft" class="calculate-button" type="button">Calculate</button>
                <button id="reset" class="reset-button" type="button" onclick="resetDraftFields()">Reset</button>
            </div><!--Button area end-->
        </div><!--bottom area end-->
    </form>
</div>
<script>
    function resetDraftFields() {
        document.getElementById('port-fwd-ft').value = document.getElementById('port-fwd-ft').defaultValue;
        document.getElementById('port-fwd-in').value = document.getElementById('port-fwd-in').defaultValue;
        document.getElementById('port-aft-ft').value = document.getElementById('port-fwd-ft').defaultValue;
        document.getElementById('port-aft-in').value = document.getElementById('port-fwd-in').defaultValue;
        document.getElementById('stbd-fwd-ft').value = document.getElementById('stbd-fwd-ft').defaultValue;
        document.getElementById('stbd-fwd-in').value = document.getElementById('stbd-fwd-in').defaultValue;
        document.getElementById('stbd-aft-ft').value = document.getElementById('stbd-aft-ft').defaultValue;
        document.getElementById('stbd-aft-in').value = document.getElementById('stbd-aft-in').defaultValue;
        document.getElementById('fwa-ft').value = document.getElementById('fwa-ft').defaultValue;
        document.getElementById('fwa-in').value = document.getElementById('fwa-in').defaultValue;
        document.getElementById('salinity').value = document.getElementById('salinity').defaultValue;
        document.getElementById('mean-draft').textContent = "";
        document.getElementById('dwa').textContent = "";
        document.getElementById('swd').textContent = "";
        document.getElementById('trim').textContent = "";
    }
    //toggle 4 drafts
     function showFourDrafts(){
    $(".fourDrafts").addClass("active");
    }
    function hideFourDrafts(){
    $(".fourDrafts").removeClass("active");
    }

    $('#draft-count').on("change",function(){
        if($(this).is(":checked")){
            showFourDrafts();
        } else {
            hideFourDrafts();
        }
    });
    // toggle salinity
         function showSalinityFWA(){
    $(".top-input").addClass("active");
    }
    function hideSalinityFWA(){
    $(".top-input").removeClass("active");
    }

    $('#salinity-fwa').on("change",function(){
        if($(this).is(":checked")){
            showSalinityFWA();
        } else {
            hideSalinityFWA();
        }
    });
    //toggle meters
    function Meters(){
    $(".unit-imperial").addClass("hidden");
    $(".unit-metric").addClass("active");
    }
    function Imperial(){
    $(".unit-imperial").removeClass("hidden");
    $(".unit-metric").removeClass("active");    }

    $('#units').on("change",function(){
        if($(this).is(":checked")){
            Meters();
        } else {
            Imperial();
        }
    });

</script>
