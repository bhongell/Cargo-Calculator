<!DOCTYPE html>
<head>
     <link rel="stylesheet" href="CSS/globalStyle.css">
    <link rel="stylesheet" href="Css/tonnageStyle.css">
</head>
    <div id="tonnage-container" class="container">
        <form class="grid-form">
            <div class="grid-container highlight">
                <div class="grid">
                    <div class="grid-item"></div>
                    <div class="grid-item grid-title">Drafts</div>
                    <div class="grid-item grid-title">Tonnage</div>
                    <div class="grid-item">Heavy</div>
                    <div class="grid-item">
                        <div class="inline">
                            <div class="inline-ftin"><input type="text" class="ftin" id="draft-hvy-ft" min="0" value=""><p class="unit-imperial">Ft</p><p class="unit-metric">M</p></div>
                            <div class="inline-ftin unit-imperial"><input type="text" class="ftin inches" id="draft-hvy-in" min="0" max="11" value=""><p>In</p></div></span>
                        </div>
                    </div>
                    <div class="grid-item">
                        <input type="text" class="input-tons" id="heavy-tons" min="0" value="">
                    </div>
                    <div class="grid-item">Current</div>
                    <div class="grid-item">
                        <div class="inline">
                            <span class="inline-ftin"><div class="ftin" id="draft-current-ft"value=""></div> <p class="unit-imperial">Ft</p><p class="unit-metric">M</p></span>
                            <span class="inline-ftin unit-imperial"><div class="ftin" id="draft-current-in"value=""></div> <p>In</p></span>
                        </div>
                    </div>
                    <div class="grid-item">
                        <div class="result" id="current-tons"></div>
                    </div>
                    <div class="grid-item">Light</div>
                    <div class="grid-item">
                        <div class="inline">
                            <span class="inline-ftin"><input type="text" class="ftin" id="draft-lite-ft" min="0" value=""> <p class="unit-imperial">Ft</p><p class="unit-metric">M</p> </span>
                            <span class="inline-ftin unit-imperial"><input type="text" class="ftin" id="draft-lite-in" min="0" max="11" value=""> <p>In</p></span>
                        </div>
                    </div>
                    <div class="grid-item">
                        <input type="text" class="input-tons" id="light-tons" min="0" value="">
                    </div>
                    <div class="grid-item-results max-tonnage"><p>Max Tonnage:</p>
                        <div class="inline-ftin">
                            <input type="text" class="result" id="max-tons" min="0" value="">
                        </div>
                    </div>
                </div>
            </div>

            <div class="bottom-area highlight">
                <div class="bottom-calcs">
                    <div class="inline">
                        <div class="title">
                            <p>Tons to Go:</p>
                        </div>
                        <div class="result" id="tons-to-max"></div>
                    </div>
                    <div class="inline">
                        <div class="title">
                            <p>TPI:</p>
                        </div>
                        <div class="result" id="tpi"></div>
                    </div>
                </div>               
                <div class="button-area">
                    <button id="calculate-tonnage" class="calculate-tonnage-button" type="button">Calculate</button>
                    <button id="reset-tonnage" class="reset-tonnage-button" type="button" onclick="resetTonnageFields()">Reset</button>
                </div>               
            </div>
        </form>
    </div>
<script>
     function resetTonnageFields() {
        document.getElementById('heavy-tons').value = document.getElementById('port-fwd-ft').defaultValue;
        document.getElementById('current-tons').value = document.getElementById('port-fwd-in').defaultValue;
        document.getElementById('draft-hvy-ft').value = document.getElementById('port-fwd-ft').defaultValue;
        document.getElementById('draft-hvy-in').value = document.getElementById('port-fwd-in').defaultValue;
        document.getElementById('draft-current-ft').value = document.getElementById('stbd-fwd-ft').defaultValue;
        document.getElementById('draft-current-in').value = document.getElementById('stbd-fwd-in').defaultValue;
        document.getElementById('draft-lite-ft').value = document.getElementById('stbd-aft-ft').defaultValue;
        document.getElementById('draft-lite-in').value = document.getElementById('stbd-aft-in').defaultValue;
        document.getElementById('light-tons').value = document.getElementById('fwa-ft').defaultValue;
        document.getElementById('max-tons').value = document.getElementById('fwa-in').defaultValue;
        document.getElementById('tons-to-max').textContent = "";
        document.getElementById('tpi').textContent = "";
    }
</script>
